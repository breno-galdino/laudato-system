services:

  redis:
    container_name: laudato-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  redis-insight:
    container_name: laudato-redis-insight
    image: redis/redisinsight:latest
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redis-insight:/data
    depends_on:
      - redis

volumes:
  redis-insight:
